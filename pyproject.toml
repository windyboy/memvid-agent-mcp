[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memvid-agent-mcp"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server for Memvid - AI memory management"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Memvid MCP Contributors"}
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "memvid-sdk>=2.0.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.hatch.build.targets.wheel]
only-include = ["memvid_mcp_server.py"]
